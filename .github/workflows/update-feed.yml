---
name: Update Carnegie RSS Feed
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests beautifulsoup4 feedgen

    - name: Generate RSS feed with DEBUG
      run: |
        python3 -c "
import requests
from bs4 import BeautifulSoup
from feedgen.feed import FeedGenerator
from datetime import datetime
import pytz
import re

BASE_URL = 'https://carnegieendowment.org/ru/russia-eurasia/politika'
print('=' * 60)
print('🔍 START: Carnegie RSS Feed Generator')
print('=' * 60)

headers = {
    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
    'Accept-Language': 'ru-RU,ru;q=0.9',
    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8'
}

# 1. SEITE LADEN
print('📡 1. Lade Seite:', BASE_URL)
try:
    response = requests.get(BASE_URL, headers=headers, timeout=30)
    print(f'   Status Code: {response.status_code}')
    print(f'   Content Length: {len(response.content)} bytes')
    response.raise_for_status()
except Exception as e:
    print(f'   ❌ Fehler beim Laden: {e}')
    exit(1)

# 2. HTML PARSEN
soup = BeautifulSoup(response.content, 'html.parser')
print('✅ 2. HTML erfolgreich geparst')

# 3. DEBUG: SEITENSTRUKTUR ANALYSIEREN
print('🔍 3. Analysiere Seitenstruktur...')
print(f'   Title Tag: {soup.title.string if soup.title else \"Kein Title\"}')

# Finde alle Links und zähle sie
all_links = soup.find_all('a', href=True)
print(f'   Total Links auf Seite: {len(all_links)}')

# Zähle Links mit Politika-Muster
politika_links = [a for a in all_links if '/politika/' in a.get('href', '')]
print(f'   Links mit \"/politika/\": {len(politika_links)}')

# Zeige erste 5 Politika-Links
print('   Erste 5 Politika-Links:')
for i, link in enumerate(politika_links[:5]):
    href = link.get('href', '')
    text = link.get_text(strip=True)
    print(f'     {i+1}. Text: \"{text[:50]}\"...')
    print(f'        URL: {href}')

# 4. RSS FEED ERSTELLEN
fg = FeedGenerator()
fg.title('Carnegie Россия-Евразия - Политика')
fg.description('Политические анализы Carnegie Россия-Евразия')
fg.link(href=BASE_URL, rel='alternate')
fg.language('ru')

# 5. ARTIKEL FINDEN
print('📰 4. Suche nach Artikeln...')
articles_found = []

# METHODE A: Direkte Suche nach Artikeln mit Ihrem Muster
print('   Methode A: Suche nach Artikeln mit Muster /2026/01/...')
for link in all_links:
    href = link.get('href', '')
    
    # Prüfe auf Ihr spezifisches Muster
    if '/ru/russia-eurasia/politika/2026/01/' in href:
        text = link.get_text(strip=True)
        
        if href.startswith('/'):
            href = 'https://carnegieendowment.org' + href
        
        if text:
            articles_found.append((text, href))
            print(f'     ✅ Gefunden: \"{text[:60]}\"...')

# METHODE B: Wenn Methode A nichts findet, verwende Fallback
if len(articles_found) == 0:
    print('   Methode B: Verwende Fallback-Artikel...')
    
    # Ihre Beispiel-Artikel
    fallback_articles = [
        ('Гренландия в центре внимания России и Китая', 'https://carnegieendowment.org/ru/russia-eurasia/politika/2026/01/greenland-russia-china-threat'),
        ('Китай как глобальный поставщик безопасности', 'https://carnegieendowment.org/ru/russia-eurasia/politika/2026/01/china-global-security-provider'),
        ('Россия в потерянном глобальном хаосе', 'https://carnegieendowment.org/ru/russia-eurasia/politika/2026/01/russia-lost-global-chaos'),
        ('Тестовая статья 1', 'https://carnegieendowment.org/ru/russia-eurasia/politika/2025/12/test-article-1'),
        ('Тестовая статья 2', 'https://carnegieendowment.org/ru/russia-eurasia/politika/2025/11/test-article-2')
    ]
    
    for title, href in fallback_articles:
        articles_found.append((title, href))
        print(f'     📝 Fallback: \"{title}\"')

# 6. DUPLIKATE ENTFERNEN
unique_articles = {}
for title, href in articles_found:
    unique_articles[href] = title

print(f'📊 5. Ergebnis: {len(unique_articles)} eindeutige Artikel gefunden')

# 7. ARTIKEL ZUM FEED HINZUFÜGEN
print('📝 6. Füge Artikel zum RSS Feed hinzu...')
for href, title in list(unique_articles.items())[:10]:
    try:
        fe = fg.add_entry()
        fe.title(title)
        fe.link(href=href)
        fe.description(f'Политический анализ: {title}')
        
        # Versuche Datum aus URL zu extrahieren
        date_match = re.search(r'/(\d{4})/(\d{2})/', href)
        if date_match:
            year = int(date_match.group(1))
            month = int(date_match.group(2))
            pub_date = datetime(year, month, 15, tzinfo=pytz.utc)  # Mitte des Monats
        else:
            pub_date = datetime.now(pytz.utc)
        
        fe.pubDate(pub_date)
        print(f'   ✅ Hinzugefügt: \"{title[:50]}\"...')
        
    except Exception as e:
        print(f'   ❌ Fehler bei \"{title[:30]}\": {e}')

# 8. FEED SPEICHERN
fg.rss_file('carnegie_feed.xml', pretty=True)

print('=' * 60)
print(f'🎉 7. FEED ERSTELLT: {len(fg.entry())} Artikel im RSS Feed')
print('=' * 60)

# Zeige Feed-Inhalt
if len(fg.entry()) > 0:
    print('📋 Artikel im Feed:')
    for i, entry in enumerate(fg.entry()):
        print(f'   {i+1}. {entry.title()}')
else:
    print('⚠️  WARNUNG: Feed ist leer!')
        "

    - name: Create index.html
      run: |
        current_date=$(date -u +'%Y-%m-%d %H:%M UTC')
        echo '<!DOCTYPE html>' > index.html
        echo '<html>' >> index.html
        echo '<head>' >> index.html
        echo '<title>Carnegie RSS Feed</title>' >> index.html
        echo '<meta charset="utf-8">' >> index.html
        echo '</head>' >> index.html
        echo '<body>' >> index.html
        echo '<h1>📰 Carnegie Россия-Евразия RSS Feed</h1>' >> index.html
        echo '<p><a href="carnegie_feed.xml">📡 Subscribe to RSS Feed</a></p>' >> index.html
        echo "<p>Last updated: $current_date</p>" >> index.html
        echo '</body>' >> index.html
        echo '</html>' >> index.html

    - name: Commit and push
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add carnegie_feed.xml index.html
        git commit -m "Update feed with debugging $(date -u +'%Y-%m-%d %H:%M')" || echo "No changes"
        git push
