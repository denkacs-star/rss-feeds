---
name: Update Carnegie RSS Feed
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout fresh copy
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Reset repository to clean state
      run: |
        git fetch origin
        git reset --hard origin/main
        git clean -fd

    - name: Create clean RSS feed
      run: |
        # Create simple valid RSS
        cat << 'XML' > carnegie_feed.xml
<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0">
<channel>
<title>Carnegie Россия-Евразия</title>
<link>https://carnegieendowment.org/ru/russia-eurasia</link>
<description>Аналитика Carnegie Россия-Евразия</description>
<language>ru</language>
<lastBuildDate>$(date -u +'%a, %d %b %Y %H:%M:%S GMT')</lastBuildDate>

<item>
<title>Гренландия в центре внимания России и Китая</title>
<link>https://carnegieendowment.org/ru/russia-eurasia/politika/2026/01/greenland-russia-china-threat</link>
<description>Анализ Carnegie</description>
<pubDate>Fri, 24 Jan 2026 10:00:00 GMT</pubDate>
</item>

<item>
<title>Китай как глобальный поставщик безопасности</title>
<link>https://carnegieendowment.org/ru/russia-eurasia/politika/2026/01/china-global-security-provider</link>
<description>Анализ Carnegie</description>
<pubDate>Thu, 23 Jan 2026 10:00:00 GMT</pubDate>
</item>

<item>
<title>Россия в потерянном глобальном хаосе</title>
<link>https://carnegieendowment.org/ru/russia-eurasia/politika/2026/01/russia-lost-global-chaos</link>
<description>Анализ Carnegie</description>
<pubDate>Wed, 22 Jan 2026 10:00:00 GMT</pubDate>
</item>
</channel>
</rss>
XML

        echo "RSS feed created"
        cat carnegie_feed.xml

    - name: Validate XML
      run: |
        echo "Validating XML..."
        if python3 -c "import xml.etree.ElementTree as ET; ET.parse('carnegie_feed.xml')"; then
          echo "✅ XML is valid"
        else
          echo "❌ XML validation failed"
          exit 1
        fi

    - name: Commit and push
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add carnegie_feed.xml
        git commit -m "Update RSS feed $(date -u +'%Y-%m-%d %H:%M')"
        git push origin main
