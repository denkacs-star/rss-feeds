---
name: Update Carnegie RSS Feed
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests beautifulsoup4 feedgen

    - name: Generate RSS feed
      run: |
        python3 -c "
import requests
from bs4 import BeautifulSoup
from feedgen.feed import FeedGenerator
from datetime import datetime
import pytz
import re

BASE_URL = 'https://carnegieendowment.org/ru/russia-eurasia/politika'

headers = {
    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
    'Accept-Language': 'ru-RU,ru;q=0.9'
}

print('Lade Seite:', BASE_URL)

try:
    response = requests.get(BASE_URL, headers=headers, timeout=30)
    response.raise_for_status()
    print('Status:', response.status_code)
    
    soup = BeautifulSoup(response.content, 'html.parser')
    
    # RSS Feed erstellen
    fg = FeedGenerator()
    fg.title('Carnegie Россия-Евразия - Политика')
    fg.description('Политические анализы Carnegie Россия-Евразия')
    fg.link(href=BASE_URL, rel='alternate')
    fg.language('ru')
    
    articles_found = []
    
    # Suche nach Artikel-Links
    all_links = soup.find_all('a', href=True)
    
    for link in all_links:
        href = link.get('href', '')
        text = link.get_text(strip=True)
        
        # Filter für Politika-Artikel
        if '/ru/russia-eurasia/politika/' in href and re.search(r'/\d{4}/\d{2}/', href):
            if href.startswith('/'):
                href = 'https://carnegieendowment.org' + href
            
            if text and len(text) > 15:
                articles_found.append((text, href))
                print('Gefunden:', text[:50], '...')
    
    # Duplikate entfernen
    unique_articles = {}
    for title, href in articles_found:
        unique_articles[href] = title
    
    print('Gefundene Artikel:', len(unique_articles))
    
    # Fallback wenn nichts gefunden
    if len(unique_articles) == 0:
        print('Keine Artikel gefunden, verwende Fallback')
        unique_articles = {
            'https://carnegieendowment.org/ru/russia-eurasia/politika/2026/01/greenland-russia-china-threat': 'Гренландия в центре внимания России и Китая',
            'https://carnegieendowment.org/ru/russia-eurasia/politika/2026/01/china-global-security-provider': 'Китай как глобальный поставщик безопасности',
            'https://carnegieendowment.org/ru/russia-eurasia/politika/2026/01/russia-lost-global-chaos': 'Россия в потерянном глобальном хаосе'
        }
    
    # Artikel zum Feed hinzufügen
    for href, title in list(unique_articles.items())[:10]:
        fe = fg.add_entry()
        fe.title(title)
        fe.link(href=href)
        fe.description(f'Анализ Carnegie: {title}')
        fe.pubDate(datetime.now(pytz.utc))
        print('Hinzugefügt:', title[:50], '...')
    
    # Feed speichern
    fg.rss_file('carnegie_feed.xml', pretty=True)
    print('RSS Feed erstellt mit', len(unique_articles), 'Artikeln')

except Exception as e:
    print('Fehler:', e)
    # Fallback Feed erstellen
    fg = FeedGenerator()
    fg.title('Carnegie Россия-Евразия')
    fg.description('Fallback Feed')
    fg.link(href=BASE_URL, rel='alternate')
    fg.language('ru')
    
    fallback_articles = [
        ('Гренландия в центре внимания России и Китая', 'https://carnegieendowment.org/ru/russia-eurasia/politika/2026/01/greenland-russia-china-threat'),
        ('Китай как глобальный поставщик безопасности', 'https://carnegieendowment.org/ru/russia-eurasia/politika/2026/01/china-global-security-provider')
    ]
    
    for title, href in fallback_articles:
        fe = fg.add_entry()
        fe.title(title)
        fe.link(href=href)
        fe.description(title)
        fe.pubDate(datetime.now(pytz.utc))
    
    fg.rss_file('carnegie_feed.xml', pretty=True)
    print('Fallback Feed erstellt')
        "

    - name: Create index.html
      run: |
        current_date=$(date -u +'%Y-%m-%d %H:%M UTC')
        echo '<!DOCTYPE html>' > index.html
        echo '<html>' >> index.html
        echo '<head>' >> index.html
        echo '<title>Carnegie RSS Feed</title>' >> index.html
        echo '<meta charset="utf-8">' >> index.html
        echo '</head>' >> index.html
        echo '<body>' >> index.html
        echo '<h1>Carnegie Россия-Евразия RSS Feed</h1>' >> index.html
        echo '<p><a href="carnegie_feed.xml">RSS Feed</a></p>' >> index.html
        echo "<p>Updated: $current_date</p>" >> index.html
        echo '</body>' >> index.html
        echo '</html>' >> index.html

    - name: Commit and push
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add carnegie_feed.xml index.html
        git commit -m "Update feed $(date -u +'%Y-%m-%d')" || echo "No changes"
        git push
