---
name: Update Carnegie RSS Feed
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests beautifulsoup4 feedgen

    - name: Generate RSS feed
      run: |
        python3 -c "
import requests
from bs4 import BeautifulSoup
from feedgen.feed import FeedGenerator
from datetime import datetime
import pytz

# URL der Carnegie Politika Seite
url = 'https://carnegieendowment.org/ru/russia-eurasia/politika'

headers = {
    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
    'Accept-Language': 'ru-RU,ru;q=0.9'
}

print('Lade Seite:', url)
response = requests.get(url, headers=headers, timeout=30)
response.raise_for_status()

soup = BeautifulSoup(response.text, 'html.parser')

# RSS Feed erstellen
fg = FeedGenerator()
fg.title('Carnegie Россия-Евразия - Политика')
fg.description('Политические анализы Carnegie Россия-Евразия')
fg.link(href=url, rel='alternate')
fg.language('ru')

# Einfache Suche nach Artikeln
articles = []

# Methode 1: Suche nach allen Links
all_links = soup.find_all('a', href=True)

for link in all_links:
    try:
        href = link.get('href', '')
        text = link.get_text(strip=True)
        
        # Filter für interessante Links
        if '/ru/' in href and len(text) > 20:
            # URL vervollständigen
            if href.startswith('/'):
                href = 'https://carnegieendowment.org' + href
            elif not href.startswith('http'):
                continue
            
            # Unerwünschte Links ausschließen
            if any(x in href for x in ['/about/', '/contact', '/donate', '/subscribe', '/login', '/programs/']):
                continue
                
            # Wahrscheinliche Artikel-Links
            if any(x in href for x in ['/publications/', '/article', '/analysis', '/commentary', '/politika']):
                articles.append((text, href))
                print(f'Gefunden: {text[:50]}...')
                
    except Exception as e:
        continue

# Methode 2: Suche nach h2/h3 mit Links
if len(articles) < 5:
    for tag in ['h2', 'h3', 'h4']:
        headings = soup.find_all(tag)
        for heading in headings:
            link = heading.find_parent('a') or heading.find('a')
            if link and link.get('href'):
                href = link.get('href')
                text = heading.get_text(strip=True)
                if len(text) > 15 and '/ru/' in href:
                    if href.startswith('/'):
                        href = 'https://carnegieendowment.org' + href
                    if href not in [a[1] for a in articles]:
                        articles.append((text, href))
                        print(f'Gefunden via {tag}: {text[:50]}...')

# Duplikate entfernen
unique_articles = {}
for title, href in articles:
    if href not in unique_articles:
        unique_articles[href] = title

print(f'Total unique articles: {len(unique_articles)}')

# Füge Artikel zum Feed hinzu (max 10)
for i, (href, title) in enumerate(list(unique_articles.items())[:10]):
    fe = fg.add_entry()
    fe.title(title)
    fe.link(href=href)
    fe.description(title)
    fe.pubDate(datetime.now(pytz.utc))
    print(f'Added to feed ({i+1}): {title[:50]}...')

# Feed speichern
fg.rss_file('carnegie_feed.xml', pretty=True)
print('RSS feed created successfully')
        "

    - name: Create index.html
      run: |
        echo '<!DOCTYPE html>' > index.html
        echo '<html>' >> index.html
        echo '<head>' >> index.html
        echo '<title>Carnegie RSS Feed</title>' >> index.html
        echo '<meta charset="utf-8">' >> index.html
        echo '</head>' >> index.html
        echo '<body>' >> index.html
        echo '<h1>Carnegie Россия-Евразия RSS Feed</h1>' >> index.html
        echo '<p><a href="carnegie_feed.xml">RSS Feed abonnieren</a></p>' >> index.html
        echo "<p>Updated: $(date -u +'%Y-%m-%d %H:%M UTC')</p>" >> index.html
        echo '</body>' >> index.html
        echo '</html>' >> index.html

    - name: Commit and push
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add carnegie_feed.xml index.html
        git commit -m "Update feed $(date -u +'%Y-%m-%d')" || echo "No changes"
        git push
