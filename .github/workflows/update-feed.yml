---
name: Update Carnegie RSS Feed
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: pip install requests beautifulsoup4 feedgen pytz

    - name: Generate RSS feed
      run: |
        python -c "
        import requests
        from bs4 import BeautifulSoup
        from feedgen.feed import FeedGenerator
        from datetime import datetime
        import pytz
        
        url = 'https://carnegieendowment.org/ru/russia-eurasia'
        headers = {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
            'Accept-Language': 'ru-RU,ru;q=0.9,en-US;q=0.8,en;q=0.7'
        }
        
        print('Lade Carnegie Russia-Eurasia Hauptseite...')
        response = requests.get(url, headers=headers, timeout=20)
        response.raise_for_status()
        print('Seite geladen')
        
        soup = BeautifulSoup(response.content, 'html.parser')
        
        # RSS-Feed konfigurieren
        fg = FeedGenerator()
        fg.title('Carnegie Россия-Евразия')
        fg.description('Аналитика Carnegie Россия-Евразия')
        fg.link(href=url, rel='alternate')
        fg.language('ru')
        
        articles_found = []
        
        # Methode 1: Suche nach Publikations-Links
        print('Suche nach Publikations-Links...')
        publication_patterns = ['/publications/', '/ru/publications/', '/article', '/analysis']
        
        all_links = soup.find_all('a', href=True)
        for link in all_links:
            href = link['href']
            text = link.get_text().strip()
            
            # Prüfe ob es ein Publikations-Link ist
            is_publication = any(pattern in href for pattern in publication_patterns)
            has_text = len(text) > 15
            
            if is_publication and has_text:
                if not href.startswith('http'):
                    href = 'https://carnegieendowment.org' + href
                
                title = text
                articles_found.append((title, href))
                print(f'Gefunden: {title[:60]}...')
        
        # Methode 2: Suche nach Karten/Cards
        if len(articles_found) < 5:
            print('Suche nach Content-Karten...')
            cards = soup.find_all(['article', 'div'], class_=True)
            
            for card in cards[:50]:
                try:
                    link_elem = card.find('a', href=True)
                    if not link_elem:
                        continue
                    
                    href = link_elem['href']
                    if not any(pattern in href for pattern in publication_patterns):
                        continue
                    
                    if not href.startswith('http'):
                        href = 'https://carnegieendowment.org' + href
                    
                    # Titel finden
                    title = None
                    for tag in ['h2', 'h3', 'h4', 'h5']:
                        title_elem = card.find(tag)
                        if title_elem:
                            title = title_elem.get_text().strip()
                            break
                    
                    if not title:
                        title = link_elem.get_text().strip()
                    
                    if title and len(title) > 10:
                        articles_found.append((title, href))
                        print(f'Gefunden in Karte: {title[:60]}...')
                        
                except:
                    continue
        
        # Duplikate entfernen
        unique_articles = {}
        for title, href in articles_found:
            unique_articles[href] = title
        
        print(f'Gefundene Artikel: {len(unique_articles)}')
        
        # Artikel zum Feed hinzufügen
        feed_count = 0
        for href, title in list(unique_articles.items())[:15]:
            try:
                fe = fg.add_entry()
                fe.title(title)
                fe.link(href=href)
                fe.description(f'Публикация Carnegie: {title}')
                fe.pubDate(datetime.now(pytz.utc))
                feed_count += 1
                print(f'Zum Feed hinzugefuegt: {title[:60]}...')
            except Exception as e:
                continue
        
        # Feed speichern
        fg.rss_file('carnegie_feed.xml', pretty=True)
        
        if feed_count > 0:
            print(f'Feed mit {feed_count} Artikeln erstellt')
        else:
            print('Keine Artikel gefunden')
        "

    - name: Update index.html
      run: |
        current_date=$(date -u +'%Y-%m-%d %H:%M UTC')
        cat > index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>RSS Feeds</title>
            <meta charset="utf-8">
        </head>
        <body>
            <h1>📰 My RSS Feeds</h1>
            <ul>
                <li><a href="carnegie_feed.xml">Carnegie Россия-Евразия</a></li>
            </ul>
            <p>Updated: $current_date</p>
        </body>
        </html>
        EOF

    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git pull origin main --rebase --autostash || true
        git add carnegie_feed.xml index.html
        git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "No changes"
        git push origin main
