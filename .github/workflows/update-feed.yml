name: Update Carnegie RSS Feed
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: pip install requests beautifulsoup4 feedgen pytz

    - name: Generate RSS feed
      run: |
        python -c "
        # Deinen generierten Python-Code hier einfügen
        print('Feed wird generiert...')
        "

    - name: Update index.html
      run: |
        current_date=$(date -u +\"%Y-%m-%d %H:%M UTC\")
        cat > index.html << EOF
        <!DOCTYPE html>
        <html>
        <head><title>RSS Feeds</title><meta charset=\"utf-8\"></head>
        <body>
          <h1>📰 My RSS Feeds</h1>
          <ul><li><a href=\"carnegie_feed.xml\">Carnegie Russia-Eurasia</a></li></ul>
          <p>Updated: \$current_date</p>
        </body>
        </html>
        EOF

    - name: Commit and push changes
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        
        # Zuerst pullen um auf dem neuesten Stand zu sein
        git pull origin main --rebase --autostash || true
        
        # Dateien hinzufügen
        git add carnegie_feed.xml index.html
        
        # Commit erstellen
        git commit -m \"Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')\" || echo \"No changes to commit\"
        
        # Push durchführen
        git push origin main
