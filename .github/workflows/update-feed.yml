name: Update Carnegie RSS Feed
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
jobs:
  update-feed:
    runs-on: ubuntu-latest
   
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Chrome and required dependencies for Ubuntu 24.04
      run: |
        # Signing key hinzufügen (neuere Methode, apt-key ist deprecated)
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
        
        # Repository hinzufügen
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        
        # Update und Chrome + alle wichtigen Abhängigkeiten installieren
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable \
          fonts-liberation libappindicator3-1 \
          libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libc6 \
          libcairo2 libcups2 libdbus-1-3 libexpat1 libfontconfig1 \
          libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 \
          libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 \
          libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 \
          libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 \
          libxss1 libxtst6 lsb-release wget xdg-utils \
          xvfb

    - name: Install dependencies
      run: pip install requests beautifulsoup4 feedgen selenium webdriver-manager
    
    - name: Generate RSS feed from actual structure
      run: |
        python3 -c "
        import requests
        from bs4 import BeautifulSoup
        from feedgen.feed import FeedGenerator
        from datetime import datetime
        import pytz
        import re
        from selenium import webdriver
        from selenium.webdriver.chrome.service import Service as ChromeService
        from selenium.webdriver.chrome.options import Options
        from webdriver_manager.chrome import ChromeDriverManager

        # Carnegie Politika Seite
        BASE_URL = 'https://carnegieendowment.org/ru/russia-eurasia/politika'
        print('🔍 Lade Carnegie Seite mit Selenium:', BASE_URL)

        try:
            # Selenium setup
            options = Options()
            options.add_argument('--headless=new')
            options.add_argument('--no-sandbox')
            options.add_argument('--disable-dev-shm-usage')
            options.add_argument('user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36')
            driver = webdriver.Chrome(service=ChromeService(ChromeDriverManager().install()), options=options)
            driver.get(BASE_URL)
            html = driver.page_source
            driver.quit()
            print(f'📊 HTML-Größe: {len(html)} bytes')

            soup = BeautifulSoup(html, 'html.parser')

            # RSS Feed erstellen
            fg = FeedGenerator()
            fg.title('Carnegie Россия-Евразия - Политика')
            fg.description('Политические анализы Carnegie Россия-Евразия')
            fg.link(href=BASE_URL, rel='alternate')
            fg.language('ru')

            articles_found = []

            # METHODE 1: Suche nach SPAN mit Text-Klassen (angepasst auf dein Beispiel)
            print('🔍 Methode 1: Suche nach Text-Spans...')
            title_spans = soup.find_all('span', class_=lambda x: x and ('headlineh5' in str(x).lower() or 'text' in str(x).lower() or 'head' in str(x).lower()))
            
            for span in title_spans:
                try:
                    title = span.get_text(strip=True)
                    if len(title) > 20:
                        link = span.find_parent('a')
                        if link and link.get('href'):
                            href = link['href']
                            if href.startswith('/'):
                                href = 'https://carnegieendowment.org' + href
                            if '/politika/' in href and href not in [a[1] for a in articles_found]:
                                articles_found.append((title, href))
                                print(f' ✅ Via Span gefunden: \"{title[:60]}...\"')
                except Exception as e:
                    continue

            # METHODE 2: Suche nach DIV mit Heading-Klassen
            if len(articles_found) < 3:
                print('🔍 Methode 2: Suche nach Heading-Divs...')
                heading_divs = soup.find_all('div', class_=lambda x: x and any(word in str(x).lower() for word in ['heading', 'h5', 'headline', 'title']))
                for div in heading_divs:
                    try:
                        title = div.get_text(strip=True)
                        if len(title) > 20:
                            link = div.find_parent('a') or div.find_next('a')
                            if link and link.get('href'):
                                href = link['href']
                                if href.startswith('/'):
                                    href = 'https://carnegieendowment.org' + href
                                if '/politika/' in href and href not in [a[1] for a in articles_found]:
                                    articles_found.append((title, href))
                                    print(f' ✅ Via Div gefunden: \"{title[:60]}...\"')
                    except Exception as e:
                        continue

            # METHODE 3: Einfache Suche nach allen Links mit langem Text (strenger Filter für aktuelle Artikel)
            if len(articles_found) < 3:
                print('🔍 Methode 3: Einfache Link-Suche...')
                all_links = soup.find_all('a', href=True)
                for link in all_links:
                    href = link.get('href', '')
                    text = link.get_text(strip=True)
                    if '/ru/russia-eurasia/politika/20' in href and 30 < len(text) < 150:  # Filter auf Jahr (z.B. 20xx)
                        if href.startswith('/'):
                            href = 'https://carnegieendowment.org' + href
                        if href not in [a[1] for a in articles_found]:
                            articles_found.append((text, href))
                            print(f' ✅ Einfacher Fund: \"{text[:60]}...\"')

            # Duplikate entfernen
            unique_articles = {href: title for title, href in articles_found if href not in unique_articles}

            print(f'📊 Insgesamt gefunden: {len(unique_articles)} Artikel')

            # Artikel zum Feed hinzufügen
            feed_count = 0
            for href, title in list(unique_articles.items())[:10]:
                try:
                    fe = fg.add_entry()
                    fe.title(title)
                    fe.link(href=href)
                    fe.description(f'Анализ Carnegie: {title}')
                    date_match = re.search(r'/(\d{4})/(\d{2})/', href)
                    pub_date = datetime(int(date_match.group(1)), int(date_match.group(2)), 15, tzinfo=pytz.utc) if date_match else datetime.now(pytz.utc)
                    fe.pubDate(pub_date)
                    feed_count += 1
                    print(f' ➕ Zum Feed hinzugefügt ({feed_count}): {title[:60]}...')
                except Exception as e:
                    print(f' ❌ Fehler: {e}')
                    continue

            # Feed speichern
            fg.rss_file('carnegie_feed.xml', pretty=True)

            print('=' * 60)
            print(f'🎉 FEED ERSTELLT: {feed_count} Artikel im RSS Feed')
            print('=' * 60)

            if feed_count > 0:
                print('📋 Artikel im Feed:')
                for i, (href, title) in enumerate(list(unique_articles.items())[:feed_count], 1):
                    print(f' {i}. {title}')
            else:
                print('⚠️ WARNUNG: Feed ist leer!')

        except Exception as e:
            print(f'❌ Kritischer Fehler: {e}')
        "

    - name: Validate and push
      run: |
        echo "Validating XML..."
        if python3 -c "import xml.etree.ElementTree as ET; ET.parse('carnegie_feed.xml'); print('✅ XML valid')"; then
          echo "XML is valid"
        else
          echo "XML has errors"
          exit 1
        fi
       
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add carnegie_feed.xml
        git commit -m "Update feed with actual parser $(date -u +'%Y-%m-%d %H:%M')" || echo "No changes"
        git push
